[package]
name = "nc-web"
description = "WebAssembly bindings for the Neural Cubes browser front end."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nc-core = { path = "../nc-core" }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
